{{- if .Values.kafka.enabled }}
# ============================================================
# Kafka（KRaft 模式，使用官方 apache/kafka image）
# 用環境變數設定，不需要自訂腳本
# ============================================================
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  serviceName: {{ .Release.Name }}-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kafka
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | default "apache/kafka:4.0.0" }}
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # KRaft 模式設定
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            # Listeners
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ .Release.Name }}-kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Storage
            - name: KAFKA_LOG_DIRS
              value: "/var/kafka-data"
            # 單節點複製因子
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            # KRaft Cluster ID（固定值，storage format 用）
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/kafka-data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.kafka.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
---
# Headless Service（StatefulSet 需要）
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-kafka
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
# ClusterIP Service（其他服務連這個）
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  selector:
    app: {{ .Release.Name }}-kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
{{- end }}
