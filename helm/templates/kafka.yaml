{{- if .Values.kafka.enabled }}
# ============================================================
# Kafka（KRaft 模式，使用官方 apache/kafka image）
# Bitnami kafka image 已於 2025/08 停止免費提供，改用 apache/kafka
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kafka-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
data:
  # KRaft 模式啟動腳本
  start.sh: |
    #!/bin/bash
    set -e
    export KAFKA_CLUSTER_ID="{{ .Values.kafka.clusterId }}"

    # 格式化 storage（只在第一次）
    if [ ! -f /var/kafka-data/meta.properties ]; then
      echo "Formatting Kafka storage..."
      /opt/kafka/bin/kafka-storage.sh format \
        -t "${KAFKA_CLUSTER_ID}" \
        -c /opt/kafka/config/kraft/server.properties
    fi

    exec /opt/kafka/bin/kafka-server-start.sh \
      /opt/kafka/config/kraft/server.properties

  server.properties: |
    # KRaft 模式 - 單節點 combined（controller + broker）
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093

    # Listeners
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://{{ .Release.Name }}-kafka:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT

    # Storage
    log.dirs=/var/kafka-data

    # 單節點設定
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    default.replication.factor=1
    min.insync.replicas=1
    num.partitions=1

    # Log retention
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  serviceName: {{ .Release.Name }}-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kafka
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kafka
    spec:
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - sh
            - -c
            - |
              cp /config/server.properties /kafka-config/server.properties
              cp /config/start.sh /kafka-config/start.sh
              chmod +x /kafka-config/start.sh
          volumeMounts:
            - name: config-template
              mountPath: /config
            - name: kafka-config
              mountPath: /kafka-config
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | default "apache/kafka:4.0.0" }}
          command:
            - /bin/bash
            - /kafka-config/start.sh
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: kafka-config
              mountPath: /kafka-config
            - name: data
              mountPath: /var/kafka-data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: {{ .Release.Name }}-kafka-config
        - name: kafka-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.kafka.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
---
# Headless Service（StatefulSet 需要）
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-kafka
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
# ClusterIP Service（其他服務用這個連）
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  selector:
    app: {{ .Release.Name }}-kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
{{- end }}
