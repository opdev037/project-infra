# ============================================
# 測試環境（地端 Kubeadm）
# 部署指令: helm upgrade --install bukenon . -n web-app -f values-staging.yaml
# ============================================

global:
  domain: bukenon.duckdns.org
  namespace: web-app

# ClusterIssuer 由 kubectl 手動管理，不由 Helm 建立（避免 ownership 衝突）
clusterIssuer:
  enabled: false

# Cloud SQL 停用（測試環境用自建 MySQL）
cloudsql:
  enabled: false
  connectionName: ""

# MySQL（測試環境自建）
mysql:
  enabled: true
  image: mysql:8.0
  storageClass: nfs-client
  storageSize: 20Gi

# Redis（測試環境自建）
redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Backend (Laravel API)
backend:
  name: api
  replicaCount: 1

  image:
    repository: opdev037/project-api
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  env:
    - name: APP_NAME
      value: "Japanese Learning API"
    - name: APP_ENV
      value: "staging"
    - name: APP_DEBUG
      value: "true"
    - name: APP_URL
      value: "https://bukenon.duckdns.org"
    - name: FRONTEND_URL
      value: "https://bukenon.duckdns.org"
    - name: DB_CONNECTION
      value: "mysql"
    - name: DB_HOST
      value: "mysql"
    - name: DB_PORT
      value: "3306"
    - name: DB_DATABASE
      value: "laravel"
    - name: REDIS_HOST
      value: "redis"
    - name: REDIS_PORT
      value: "6379"
    - name: QUEUE_CONNECTION
      value: "redis"
    - name: CACHE_DRIVER
      value: "redis"
    - name: SESSION_DRIVER
      value: "redis"

  secretEnv:
    - name: APP_KEY
      secretName: app-secrets
      secretKey: app-key
    - name: DB_USERNAME
      secretName: app-secrets
      secretKey: db-username
    - name: DB_PASSWORD
      secretName: app-secrets
      secretKey: db-password
    - name: GOOGLE_CLIENT_ID
      secretName: app-secrets
      secretKey: google-client-id
    - name: GOOGLE_CLIENT_SECRET
      secretName: app-secrets
      secretKey: google-client-secret

# Frontend (Vue 3)
frontend:
  name: frontend
  replicaCount: 1

  image:
    repository: opdev037/project-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: bukenon.duckdns.org
      paths:
        - path: /api
          pathType: Prefix
          backend: api
        - path: /sanctum
          pathType: Prefix
          backend: api
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    - secretName: japanese-learning-tls
      hosts:
        - bukenon.duckdns.org

# Horizon (Queue Worker)
horizon:
  enabled: true
  name: horizon
  replicaCount: 1

  image:
    repository: opdev037/project-horizon
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# ============================================================
# Elasticsearch（測試環境自建 - 單節點模式）
# ============================================================
elasticsearch:
  enabled: true
  replicas: 1
  minimumMasterNodes: 1
  clusterName: "japanese-learning-es"
  # 降低 JVM heap，配合測試環境記憶體限制
  esJavaOpts: "-Xmx512m -Xms512m"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  persistence:
    enabled: true
    storageClass: "nfs-client"
    size: 30Gi
  service:
    type: ClusterIP
    port: 9200
  # 單節點模式必須設定，否則叢集無法啟動
  extraEnvs:
    - name: discovery.type
      value: single-node
    - name: xpack.security.enabled
      value: "false"

# ============================================================
# Kibana（測試環境 - 連接本地 Elasticsearch）
# ============================================================
kibana:
  enabled: true
  elasticsearchHosts: "http://elasticsearch-master:9200"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  service:
    type: ClusterIP
    port: 5601

# ============================================================
# Logstash（測試環境 - 接收 Kafka 訊息並寫入 Elasticsearch）
# ============================================================
logstash:
  enabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  persistence:
    enabled: false
  # Pipeline：從 Kafka 讀取 → 寫入 Elasticsearch
  logstashPipeline:
    logstash.conf: |
      input {
        kafka {
          bootstrap_servers => "japanese-learning-kafka:9092"
          topics => ["app-logs"]
          codec => "json"
          group_id => "logstash-consumer"
        }
      }
      filter {
        if [fields][app] == "backend" {
          mutate {
            add_field => { "[@metadata][index]" => "backend-logs" }
          }
        } else {
          mutate {
            add_field => { "[@metadata][index]" => "app-logs" }
          }
        }
      }
      output {
        elasticsearch {
          hosts => ["http://elasticsearch-master:9200"]
          index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
        }
      }

# ============================================================
# Kafka（測試環境 - KRaft 模式，不需要 ZooKeeper）
# ============================================================
kafka:
  enabled: true
  # KRaft 模式（Kafka 3.3+，內建 Raft，無需 ZooKeeper）
  kraft:
    enabled: true
  # Combined 模式：Controller 同時擔任 Broker
  controller:
    replicaCount: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  broker:
    replicaCount: 0  # 0 = combined 模式
  persistence:
    enabled: true
    storageClass: "nfs-client"
    size: 8Gi
  service:
    type: ClusterIP
    ports:
      client: 9092
  # 測試環境關閉 SASL，全部用 PLAINTEXT，不需要密碼
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
  sasl:
    enabledMechanisms: ""
    interbroker:
      mechanism: ""
  # 自動建立 Topics
  provisioning:
    enabled: true
    topics:
      - name: app-logs
        partitions: 1
        replicationFactor: 1
        config:
          retention.ms: "604800000"  # 保留 7 天
      - name: app-events
        partitions: 1
        replicationFactor: 1
        config:
          retention.ms: "604800000"
