apiVersion: v2
name: japanese-learning
description: A Helm chart for Japanese Learning web application
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - japanese
  - learning
  - laravel
  - vue
maintainers:
  - name: opdev037
    email: operationtgfc037@gmail.com

dependencies:
  - name: elasticsearch
    version: "7.17.3"
    repository: "https://helm.elastic.co"
    condition: elasticsearch.enabled

  - name: kibana
    version: "7.17.3"
    repository: "https://helm.elastic.co"
    condition: kibana.enabled

  - name: logstash
    version: "7.17.3"
    repository: "https://helm.elastic.co"
    condition: logstash.enabled

  # Kafka 改為自訂 templates/kafka.yaml（apache/kafka 官方 image）
  # Bitnami kafka image 於 2025/08 起不再免費公開，故移除依賴
